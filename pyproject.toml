[project]
name = "photoprism-vision"
version = "0.1.0"
description = "Computer vision API for PhotoPrism: image captioning, labels, and NSFW detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
    "hf-xet>=1.1.5",
    "ollama>=0.5.1",
    "pillow>=12.2.0",
    "pydantic>=2.11.7",
    "requests>=2.33.1",
    "timm>=1.0.17",
    "torch>=2.11.0",
    "transformers>=4.53.2,<5.0",
]
